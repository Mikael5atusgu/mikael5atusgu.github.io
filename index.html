<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HoraCerta - Calendário Escolar">
    <title>HoraCerta - Calendário Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <button class="icon-button menu-button" id="menuButton" title="Menu" aria-label="Abrir menu">☰</button>
            <div class="brand">
                <div class="brand-icon">▦</div>
                <span>HoraCerta</span>
            </div>
            <div class="search-container">
                <span class="search-icon">⌕</span>
                <input type="search" id="searchInput" placeholder="Pesquisar eventos..." autocomplete="off">
            </div>
            <div class="top-actions">
                <button class="top-icon" id="themeToggle" title="Modo Noturno" aria-label="Alternar modo noturno">☾</button>
                <button class="top-icon" title="Notificações" aria-label="Notificações">♧</button>
                <button class="top-icon" title="Configurações" aria-label="Configurações">⚙</button>
                <div class="avatar">MS</div>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar" id="sidebar">
                <button class="new-event-button" id="newEventButton"><span>＋</span> Novo evento</button>
                
                <section class="mini-calendar-section">
                    <div class="mini-calendar-header">
                        <strong id="miniMonthName">AGO 2026</strong>
                        <div>
                            <button class="mini-nav" id="miniPrev">‹</button>
                            <button class="mini-nav" id="miniNext">›</button>
                        </div>
                    </div>
                    <div class="week-labels mini-week">
                        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                    </div>
                    <div class="mini-days" id="miniDays"></div>
                </section>

                <section class="calendar-categories">
                    <div class="section-title">MEU CALENDÁRIO</div>
                    <button class="category-filter active" data-category="Aulas"><span class="category-dot blue"></span><span>▣</span> Aulas</button>
                    <button class="category-filter active" data-category="Provas"><span class="category-dot red"></span><span>▤</span> Provas</button>
                    <button class="category-filter active" data-category="Feriados"><span class="category-dot green"></span><span>⚑</span> Feriados</button>
                    <button class="category-filter active" data-category="Reuniões"><span class="category-dot purple"></span><span>♧</span> Reuniões</button>
                    <button class="category-filter active" data-category="Atividades"><span class="category-dot orange"></span><span>ϟ</span> Atividades</button>
                </section>

                <div class="school-info">
                    <strong>Instituto Federal de Mato Grosso</strong>
                    <span>Ano letivo 2026 · 2º Semestre</span>
                </div>
            </aside>

            <main class="calendar-area">
                <div class="calendar-toolbar">
                    <div class="toolbar-left">
                        <button class="today-button" id="todayButton">Hoje</button>
                        <button class="navigation-button" id="previousMonth" title="Mês anterior">‹</button>
                        <button class="navigation-button" id="nextMonth" title="Próximo mês">›</button>
                        <h1 id="currentMonth">Agosto 2026</h1>
                    </div>
                    <div class="view-buttons">
                        <button class="view-button" data-view="day">Dia</button>
                        <button class="view-button" data-view="week">Semana</button>
                        <button class="view-button selected" data-view="month">Mês</button>
                    </div>
                </div>
                <div class="calendar-week-header">
                    <div>Domingo</div><div>Segunda</div><div>Terça</div><div>Quarta</div><div>Quinta</div><div>Sexta</div><div>Sábado</div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </main>
        </div>
    </div>

    <div class="modal-overlay hidden" id="eventModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Novo evento</h2>
                <button class="modal-close" id="closeModal" aria-label="Fechar">×</button>
            </div>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventTitle">Título</label>
                    <input type="text" id="eventTitle" placeholder="Ex.: Prova de Matemática" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Data</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Horário</label>
                        <input type="time" id="eventTime" value="07:30">
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventCategory">Categoria</label>
                    <select id="eventCategory">
                        <option value="Aulas">Aulas</option>
                        <option value="Provas">Provas</option>
                        <option value="Feriados">Feriados</option>
                        <option value="Reuniões">Reuniões</option>
                        <option value="Atividades">Atividades</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Descrição</label>
                    <textarea id="eventDescription" rows="3" placeholder="Informações adicionais..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-button" id="cancelModal">Cancelar</button>
                    <button type="submit" class="save-button">Salvar evento</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
